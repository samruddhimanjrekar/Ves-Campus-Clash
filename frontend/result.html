<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Clash - Result</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="container">
      <h1>🏆 Campus Clash</h1>

      <h2>Game Over!</h2>

      <h3 id="finalScore">Final Score: 0</h3>

      <button id="downloadBtn">Download Story Card</button>

      <div id="storyCard" class="story-card">
        <div class="story-header">
          <h1>🏆 CAMPUS CLASH</h1>
        </div>

        <div class="story-content">
          <h2 id="storyPlayer"></h2>

          <p id="storyInstitute"></p>

          <div class="score-box">
            <h3>FINAL SCORE</h3>

            <h1 id="storyScore">0</h1>
          </div>
        </div>

        <div class="story-footer">
          <p>Share your victory!</p>

          <h3>@ves.ac.in</h3>
        </div>
      </div>

      <p class="share-text">
        📸 Download your Story Card and share it on Instagram. Don't forget to
        tag <strong>@ves.ac.in</strong>!
      </p>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <script src="js/result.js"></script>
  </body>
</html>
